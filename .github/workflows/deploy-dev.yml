name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      api_service_name: mt-oil-api-dev
      tf_dir: infra/environments/dev
      frontend_bucket: ${{ vars.GCP_PROJECT_ID }}-mt-oil-dashboard-dev
