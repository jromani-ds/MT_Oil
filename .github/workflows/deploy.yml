name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      api_service_name:
        required: true
        type: string
      tf_dir:
        required: true
        type: string
      frontend_bucket:
        required: true
        type: string

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REGISTRY_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
  ARTIFACT_REGISTRY_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/mt-oil-api/mt-oil-api
  IMAGE_SHA_TAG: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/mt-oil-api/mt-oil-api:${{ github.sha }}

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required config
        run: |
          missing=0
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then echo "::error::GCP_PROJECT_ID repository variable is not set"; missing=1; fi
          if [ -z "${{ vars.GCP_REGION }}" ]; then echo "::error::GCP_REGION repository variable is not set"; missing=1; fi
          if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" ]; then echo "::error::GCP_SERVICE_ACCOUNT_EMAIL repository secret is not set"; missing=1; fi
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER repository secret is not set"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          audience: https://github.com/${{ github.repository }}
          token_format: access_token
          access_token_lifetime: 1800s

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: beta

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_SHA_TAG }}
            ${{ env.ARTIFACT_REGISTRY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform apply
        run: |
          cd ${{ inputs.tf_dir }}
          terraform init \
            -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate" \
            -backend-config="prefix=${{ inputs.environment }}/terraform.tfstate"
          terraform apply \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="api_image=${{ env.IMAGE_SHA_TAG }}" \
            -auto-approve -input=false

      - name: Get API URL
        id: api
        run: |
          URL=$(gcloud run services describe ${{ inputs.api_service_name }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: VITE_API_BASE_URL=${{ steps.api.outputs.url }} npm run build

      - name: Deploy frontend to GCS
        working-directory: ./frontend
        run: gsutil -m rsync -r -d dist gs://${{ inputs.frontend_bucket }}

      - name: Show deployed URLs
        run: |
          echo "API: ${{ steps.api.outputs.url }}"
          echo "Frontend entry: https://${{ inputs.frontend_bucket }}.storage.googleapis.com/index.html"
          echo "Note: GCS static website serving may not resolve / to index.html for this bucket URL; use /index.html as the entry point."
