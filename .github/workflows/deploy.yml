name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      api_service_name:
        required: true
        type: string
      tf_dir:
        required: true
        type: string
      frontend_bucket:
        required: true
        type: string

env:
  GCP_PROJECT_ID: my-project-1508887546225
  GCP_REGION: us-central1
  GCP_SERVICE_ACCOUNT_EMAIL: github-actions@my-project-1508887546225.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1099152738416/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider # pragma: allowlist secret
  ARTIFACT_REGISTRY_IMAGE: us-central1-docker.pkg.dev/my-project-1508887546225/mt-oil-api/mt-oil-api
  IMAGE_SHA_TAG: us-central1-docker.pkg.dev/my-project-1508887546225/mt-oil-api/mt-oil-api:${{ github.sha }}

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}
          audience: https://github.com/${{ github.repository }}
          token_format: access_token
          access_token_lifetime: 1800s

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          install_components: beta

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_SHA_TAG }}
            ${{ env.ARTIFACT_REGISTRY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform apply
        run: |
          cd ${{ inputs.tf_dir }}
          terraform init
          terraform apply -var="api_image=${{ env.IMAGE_SHA_TAG }}" -auto-approve -input=false

      - name: Get API URL
        id: api
        run: |
          URL=$(gcloud run services describe ${{ inputs.api_service_name }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: VITE_API_BASE_URL=${{ steps.api.outputs.url }} npm run build

      - name: Deploy frontend to GCS
        working-directory: ./frontend
        run: gsutil -m rsync -r -d dist gs://${{ inputs.frontend_bucket }}

      - name: Show deployed URLs
        run: |
          echo "API: ${{ steps.api.outputs.url }}"
          echo "Frontend: https://storage.googleapis.com/${{ inputs.frontend_bucket }}"
