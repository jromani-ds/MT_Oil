name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  github-config:
    name: Validate GitHub Actions config
    runs-on: ubuntu-latest
    steps:
      - name: Validate required repository config
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          missing=0
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then echo "::error::GCP_PROJECT_ID repository variable is not set"; missing=1; fi
          if [ -z "${{ vars.GCP_REGION }}" ]; then echo "::error::GCP_REGION repository variable is not set"; missing=1; fi
          if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" ]; then echo "::error::GCP_SERVICE_ACCOUNT_EMAIL repository secret is not set"; missing=1; fi
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER repository secret is not set"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/

      - name: Terraform validate (dev)
        run: |
          cd infra/environments/dev
          terraform init -backend=false
          terraform validate

      - name: Terraform validate (prod)
        run: |
          cd infra/environments/prod
          terraform init -backend=false
          terraform validate
