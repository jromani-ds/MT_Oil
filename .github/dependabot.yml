version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "jromani-ds"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "jromani-ds"
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "terraform"
    directory: "/infra"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    reviewers:
      - "jromani-ds"
    labels:
      - "dependencies"
      - "terraform"
